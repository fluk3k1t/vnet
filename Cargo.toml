[package]
name = "vnet"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
macaddr = "1.0"
anyhow = "1.0"
once_cell = "1"
crossbeam = "0.8.4"
ractor = { version = "0.15.8", features = ["async-trait"] }
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.20", features = ["std", "registry", "fmt"] }
futures = "0.3.31"
async-trait ="0.1.89"
const-addrs = { version = "0.2.0", features = ["mac"] }
rand = "0.9.2"
const-random = "0.1.18"
ipnet = "2.11.0"